name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R assets dist/
          cp -R engenharia dist/
          if [ -f CNAME ]; then cp CNAME dist/; fi
          cp favicon.ico dist/
          cp index.html dist/
          cp og-preview.svg dist/
          cp privacy-policy.html dist/
          cp style.css dist/
          touch dist/.nojekyll

      - name: Inspect artifact payload
        run: |
          echo "Files in dist:"
          find dist -maxdepth 3 -type f | sort
          echo ""
          echo "Total dist size:"
          du -sh dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5